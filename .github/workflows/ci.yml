name: ci

# 只做「能不能跑」的静态检查，不连真实路由器（CI 里没有那台设备）。
# 目的：把这几类问题挡在合入前 —— 语法错、变量改了没改全、shell 里用到了 busybox 没有的写法。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Python 语法（全部脚本可编译）
        run: python -m compileall -q scripts

      - name: Python 静态检查（未定义名 / 未使用导入）
        run: |
          pip install pyflakes
          python -m pyflakes scripts

      - name: 文档里引用的脚本都存在
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          files = [root / "README.md", root / "scripts/README.md",
                   *sorted(root.glob("docs/*.md"))]
          pat = re.compile(r"scripts/[0-9]{2}-[a-z0-9-]+\.(?:py|sh)")
          refs = set()
          for f in files:
              refs |= set(pat.findall(f.read_text(encoding="utf-8")))
          missing = sorted(r for r in refs if not (root / r).is_file())
          for r in missing:
              print("missing:", r)
          print("%d 个脚本引用，%d 个缺失" % (len(refs), len(missing)))
          sys.exit(1 if missing else 0)
          PY

      - name: Shell 语法（POSIX 子集，dash 与 busybox ash 行为接近）
        run: |
          fail=0
          for f in scripts/*.sh; do
            echo "--- $f"
            dash -n "$f" || fail=1
          done
          exit $fail

      - name: shellcheck（只报 error 级别，阻塞）
        # 2026-10-24：存量 error 已为 0（本地 shellcheck 0.11.0 全量跑过 7 个 .sh），
        # 故去掉 continue-on-error 改为阻塞。余下的只有 warning/note：
        # SC3037（echo -n，busybox ash 支持）、SC2009/SC2010（只影响展示）、
        # 个别 SC2046 —— 都不影响脚本行为，暂不纳入阻塞口径。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error scripts/*.sh
